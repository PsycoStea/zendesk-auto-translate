<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 340px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .header img {
            width: 32px;
            height: 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #2f3941;
        }

        .version {
            font-size: 11px;
            color: #999;
            margin-left: auto;
        }

        .status-section {
            background: #f5f7f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: #68737d;
            font-weight: 500;
        }

        .status-value {
            color: #2f3941;
            font-weight: 600;
        }

        .toggle-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 16px;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            color: #2f3941;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1f73b7;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .section-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #2f3941;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .provider-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .provider-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #2f3941;
            cursor: pointer;
        }

        .provider-option input[type="radio"] {
            margin: 0;
            cursor: pointer;
        }

        .libre-fields {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px;
            background: #f5f7f9;
            border-radius: 6px;
        }

        .libre-fields.visible {
            display: flex;
        }

        .libre-fields label {
            font-size: 11px;
            color: #68737d;
            font-weight: 500;
        }

        .libre-fields input[type="text"],
        .libre-fields input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid #d8dcde;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }

        .libre-fields input:focus {
            outline: none;
            border-color: #1f73b7;
        }

        .save-btn {
            width: 100%;
            background: #1f73b7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover { background: #1557a0; }
        .save-btn:disabled { background: #ccc; cursor: not-allowed; }

        .save-msg {
            font-size: 12px;
            margin-top: 6px;
            min-height: 16px;
        }
        .save-msg.success { color: #038153; }
        .save-msg.error { color: #cc3340; }

        .footer {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            font-size: 11px;
            color: #999;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-indicator.active { background-color: #10b981; }
        .status-indicator.inactive { background-color: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon48.png" alt="Icon">
        <h1>Zendesk Auto Translator</h1>
        <span class="version">v1.0.23</span>
    </div>

    <div class="status-section">
        <div class="status-row">
            <span class="status-label">Status:</span>
            <span class="status-value" id="status">
                <span class="status-indicator active"></span>
                <span id="statusText">Active</span>
            </span>
        </div>
        <div class="status-row">
            <span class="status-label">Provider:</span>
            <span class="status-value" id="providerStatus">Google Translate</span>
        </div>
        <div class="status-row">
            <span class="status-label">Detected Language:</span>
            <span class="status-value" id="detectedLanguage">None</span>
        </div>
        <div class="status-row">
            <span class="status-label">Cached Translations:</span>
            <span class="status-value" id="memorySize">0</span>
        </div>
    </div>

    <div class="toggle-section">
        <span class="toggle-label">Enable Translator</span>
        <label class="toggle-switch">
            <input type="checkbox" id="toggleSwitch" checked>
            <span class="slider"></span>
        </label>
    </div>

    <span class="section-label">Translation Provider</span>
    <div class="provider-options">
        <label class="provider-option">
            <input type="radio" name="provider" value="google" id="providerGoogle">
            <span>Google Translate (default)</span>
        </label>
        <label class="provider-option">
            <input type="radio" name="provider" value="libretranslate" id="providerLibre">
            <span>LibreTranslate (self-hosted)</span>
        </label>
    </div>

    <div class="libre-fields" id="libreFields">
        <label for="libreUrl">Server URL</label>
        <input type="text" id="libreUrl" placeholder="https://libretranslate.mydomain.com" autocomplete="off" spellcheck="false">
        <label for="libreApiKey">API key (optional)</label>
        <input type="password" id="libreApiKey" placeholder="Leave blank if not required" autocomplete="off">
    </div>

    <button class="save-btn" id="saveBtn">Save settings</button>
    <div class="save-msg" id="saveMsg"></div>

    <div class="footer">
        Made for Mac Group Global
    </div>

    <script src="popup.js"></script>
</body>
</html>
