<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* ---------------- Theme tokens ---------------- */

        :root {
            color-scheme: light dark;

            --bg: #ffffff;
            --bg-card: #f6f8fa;
            --bg-card-hover: #eef4fa;
            --text: #1f2328;
            --text-muted: #59636e;
            --text-faint: #8c959f;
            --border: #d8dee4;
            --border-soft: #eaedef;
            --accent: #1f73b7;
            --accent-hover: #155a92;
            --accent-bg: #eef6fc;
            --success: #1a7f37;
            --error: #cc3340;
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --indicator-active: #16a34a;
            --indicator-inactive: #ef4444;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161b22;
                --bg-card: #1c232c;
                --bg-card-hover: #232b35;
                --text: #e6edf3;
                --text-muted: #9ba9b9;
                --text-faint: #6e7b8a;
                --border: #2d343d;
                --border-soft: #232930;
                --accent: #58a6ff;
                --accent-hover: #79b8ff;
                --accent-bg: rgba(88, 166, 255, 0.12);
                --success: #3fb950;
                --error: #f85149;
                --error-bg: rgba(248, 81, 73, 0.10);
                --error-border: rgba(248, 81, 73, 0.40);
                --indicator-active: #3fb950;
                --indicator-inactive: #f85149;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.30);
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            padding: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.4;
        }

        /* ---------------- Header ---------------- */

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .header img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: block;
        }

        .header img.logo-light { display: block; }
        .header img.logo-dark  { display: none; }

        @media (prefers-color-scheme: dark) {
            .header img.logo-light { display: none; }
            .header img.logo-dark  { display: block; }
        }

        .header h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .header .version {
            font-size: 11px;
            color: var(--text-faint);
            margin-left: auto;
            font-variant-numeric: tabular-nums;
        }

        /* ---------------- Status card ---------------- */

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            line-height: 1.6;
        }

        .status-row + .status-row {
            margin-top: 2px;
        }

        .status-label {
            color: var(--text-muted);
        }

        .status-value {
            color: var(--text);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        .status-indicator {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--indicator-inactive);
        }
        .status-indicator.active { background: var(--indicator-active); }

        /* ---------------- Toggle row ---------------- */

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
        }

        .toggle-label {
            font-size: 13px;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--border);
            transition: 0.2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            top: 3px;
            background: #fff;
            transition: 0.2s;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        input:checked + .slider {
            background: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* ---------------- Buttons ---------------- */

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
        }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--accent-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-tiny {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .btn-tiny:hover:not(:disabled) {
            background: var(--error-bg);
            color: var(--error);
            border-color: var(--error-border);
        }
        .btn-tiny:disabled { opacity: 0.5; cursor: not-allowed; }

        .row-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .row-buttons .btn { flex: 1 1 0; }

        /* ---------------- Cache row inside status card ---------------- */

        .cache-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border-soft);
            font-size: 12.5px;
            line-height: 1.6;
        }

        .cache-row .status-label { flex: 0 0 auto; }

        .cache-row .cache-value {
            flex: 1 1 auto;
            text-align: right;
            color: var(--text);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .cache-row .btn-tiny { flex: 0 0 auto; }

        /* ---------------- Collapsible fallback section ---------------- */

        details.fallback {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 0;
        }

        details.fallback > summary {
            list-style: none;
            cursor: pointer;
            padding: 8px 12px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            user-select: none;
        }
        details.fallback > summary::-webkit-details-marker { display: none; }

        details.fallback > summary::after {
            content: '⌃';
            display: inline-block;
            font-size: 13px;
            color: var(--text-muted);
            transform: rotate(180deg);
            transition: transform 0.15s;
        }
        details.fallback[open] > summary::after {
            transform: rotate(0deg);
        }

        .fallback-body {
            padding: 0 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .fallback-body label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .fallback-body input[type="text"],
        .fallback-body input[type="password"] {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12.5px;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
        }

        .fallback-body input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-bg);
        }

        .fallback-hint {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-top: 2px;
        }

        .save-msg {
            font-size: 11.5px;
            min-height: 14px;
            margin-top: 4px;
        }
        .save-msg.success { color: var(--success); }
        .save-msg.error { color: var(--error); }

        /* ---------------- Footer ---------------- */

        .footer {
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px solid var(--border-soft);
            text-align: center;
            font-size: 10.5px;
            color: var(--text-faint);
        }
    </style>
</head>
<body>
    <div class="header">
        <img class="logo logo-light" src="icon48.png" alt="">
        <img class="logo logo-dark"  src="icon48-dark.png" alt="">
        <h1>Zendesk Auto Translator</h1>
        <span class="version">v2.0.7</span>
    </div>

    <div class="card">
        <div class="status-row">
            <span class="status-label">Status</span>
            <span class="status-value" id="status">
                <span class="status-indicator active"></span>
                <span id="statusText">Active</span>
            </span>
        </div>
        <div class="status-row">
            <span class="status-label">Detected language</span>
            <span class="status-value" id="detectedLanguage">None</span>
        </div>
        <div class="status-row">
            <span class="status-label">Fallback</span>
            <span class="status-value" id="fallbackStatus">Not configured</span>
        </div>
        <div class="cache-row">
            <span class="status-label">Cache</span>
            <span class="cache-value" id="cacheStatus">0 entries</span>
            <button class="btn-tiny" id="clearCacheBtn" type="button">Clear</button>
        </div>
    </div>

    <div class="toggle-row">
        <span class="toggle-label">Enable translator</span>
        <label class="toggle-switch">
            <input type="checkbox" id="toggleSwitch" checked>
            <span class="slider"></span>
        </label>
    </div>

    <details class="fallback" id="fallbackDetails">
        <summary>Fallback translator (LibreTranslate)</summary>
        <div class="fallback-body">
            <label for="libreUrl">Server URL</label>
            <input type="text" id="libreUrl" placeholder="https://libretranslate.mydomain.com" autocomplete="off" spellcheck="false">
            <label for="libreApiKey">API key (optional)</label>
            <input type="password" id="libreApiKey" placeholder="Leave blank if not required" autocomplete="off">
            <div class="fallback-hint">Used only when Google Translate fails. Leave the URL blank to disable.</div>
            <button class="btn btn-primary" id="saveBtn" style="margin-top: 4px;">Save settings</button>
            <div class="save-msg" id="saveMsg"></div>
        </div>
    </details>

    <button class="btn btn-secondary" id="manageMacrosBtn" type="button">Manage macros…</button>

    <div class="footer">
        Made for Mac Group Global
    </div>

    <script src="popup.js"></script>
</body>
</html>
